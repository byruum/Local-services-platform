<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruth Styles Canvas Pro</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <div class="editor-container">
    <!-- LEFT TOOLBAR -->
    <div class="sidebar">
      <h4>Templates</h4>
      <button onclick="loadTemplate('salon')">💇 Salon Promo</button>
      <button onclick="loadTemplate('mtumba')">👕 Mtumba Sale</button>
      <button onclick="loadTemplate('price')">💰 Price List</button>

      <h4>Elements</h4>
      <button onclick="addText()">+ Add Text</button>
      <button onclick="addShape('rect')">+ Add Box</button>
      <button onclick="document.getElementById('imgUpload').click()">+ Upload Image</button>
      <input type="file" id="imgUpload" accept="image/*" style="display:none">

      <h4>Export</h4>
      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <!-- CANVAS AREA -->
    <div class="canvas-area">
      <canvas id="mainCanvas" width="1080" height="1080"></canvas>
    </div>

    <!-- RIGHT PROPERTIES -->
    <div class="properties">
      <h4>Text Style</h4>
      <input type="color" id="textColor" value="#000000">
      <select id="fontSize">
        <option>24px</option><option>36px</option><option>48px</option><option>64px</option>
      </select>
      <select id="fontFamily">
        <option>Arial</option><option>Impact</option><option>Georgia</option>
      </select>
    </div>
  </div>

  <script src="Editor.js"></script>
</body>
</html>
