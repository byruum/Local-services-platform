<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruth Styles Pro Canvas</title>
  <link rel="stylesheet" href="Style.css?v=2">
</head>
<body>
  <div class="editor-container">
    <div class="sidebar">
      <h4>Templates</h4>
      <button onclick="loadTemplate('salon')">💇 Salon Promo</button>
      <button onclick="loadTemplate('mtumba')">👕 Mtumba Sale</button>
      <button onclick="loadTemplate('price')">💰 Price List</button>

      <h4>Elements</h4>
      <button onclick="addText()">+ Add Text</button>
      <button onclick="addBox()">+ Add Box</button>
      <button onclick="document.getElementById('imgUpload').click()">+ Upload Image</button>
      <input type="file" id="imgUpload" accept="image/*" style="display:none">

      <h4>Export</h4>
      <button onclick="downloadCanvas()">Download PNG</button>
    </div>

    <div class="canvas-area">
      <canvas id="mainCanvas" width="900" height="900"></canvas>
    </div>
  </div>
  <script src="Editor.js?v=2"></script>
</body>
</html>
