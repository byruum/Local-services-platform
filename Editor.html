<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Webtool AI Designer</title>
  <link rel="stylesheet" href="Style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
  <header>
    <h2>🤖 Webtool AI Designer</h2>
    <div>
      <button onclick="aiGenerate()">✨ AI Generate</button>
      <button onclick="downloadCanvas()">⬇️ Export HD</button>
    </div>
  </header>

  <div class="editor-wrap">
    <!-- LEFT: AI + TEMPLATES -->
    <aside class="left-panel">
      <h3>AI Tools</h3>
      <input id="aiPrompt" placeholder="Describe design: Salon promo for braids">
      <button onclick="aiGenerate()">Generate Design</button>
      <button onclick="aiSuggestText()">✨ AI Write Caption</button>
      <button onclick="aiRemoveBg()">🪄 Remove BG</button>

      <h3>Smart Templates</h3>
      <div class="template-grid">
        <div class="template" onclick="loadAI('salon')">💇 Salon AI</div>
        <div class="template" onclick="loadAI('mtumba')">👕 Mtumba AI</div>
        <div class="template" onclick="loadAI('offer')">🔥 Offer AI</div>
      </div>

      <h3>Elements</h3>
      <button onclick="addText()">T Text</button>
      <button onclick="addImage()">🖼️ Upload</button>
      <input type="file" id="imgInput" hidden>
    </aside>

    <!-- CENTER: CANVAS -->
    <main class="canvas-stage">
      <canvas id="c" width="1080" height="1080"></canvas>
    </main>

    <!-- RIGHT: AI PROPERTIES -->
    <aside class="right-panel">
      <h3>Smart Edit</h3>
      <label>AI Style: 
        <select id="aiStyle" onchange="applyAIStyle()">
          <option>Luxury</option><option>Bold Sale</option><option>Minimal</option><option>African</option>
        </select>
      </label>
      <label>Magic Resize: 
        <select id="resize" onchange="magicResize()">
          <option>Instagram Post</option><option>WhatsApp Status</option><option>Facebook Cover</option>
        </select>
      </label>
      <h4>Layers</h4>
      <div id="layerList"></div>
    </aside>
  </div>
<script src="Editor.js"></script>
</body>
</html>
